[package]
name = "api-sentinel-parser"
version = "0.1.0"
edition = "2021"
authors = ["Prince Kumar"]
description = "HTTP Stream Parser and Telemetry Normalization Engine for API-Sentinel"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
name = "api_sentinel_parser"
path = "src/lib.rs"
